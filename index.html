<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#10172b"><title>GEAR FRONTIER: Blast Mission</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10172b;color:#fff;font-family:system-ui,-apple-system,sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%}#hud{position:fixed;inset:0;pointer-events:none;padding:calc(env(safe-area-inset-top) + 12px) 14px 14px}.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.panel{background:#0b1224cc;border:1px solid #7de8ff66;border-radius:14px;padding:10px 13px;box-shadow:0 0 20px #42cfff18}.title{font-size:12px;letter-spacing:2px;color:#73e8ff;font-weight:800}.stats{font-size:14px;font-weight:750;margin-top:3px}.health{height:7px;width:130px;background:#29354e;border-radius:99px;overflow:hidden;margin-top:7px}.health>i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#4cffb1,#d9ff73);transition:width .15s}.help{font-size:11px;color:#c7d7ef;max-width:145px;text-align:right;line-height:1.5}.bottom{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 16px);display:flex;justify-content:space-between;align-items:end;padding:0 18px;pointer-events:none}.stick{width:116px;height:116px;border:2px solid #b4eaff88;background:#0a183d99;border-radius:50%;position:relative;pointer-events:auto;touch-action:none;box-shadow:inset 0 0 25px #46caff18}.knob{position:absolute;width:46px;height:46px;border-radius:50%;background:#74e5ffbb;border:2px solid white;left:33px;top:33px;box-shadow:0 0 16px #4fdcff88;pointer-events:none}.actions{display:flex;gap:10px;align-items:end;pointer-events:auto}.action{border:2px solid #b7efff99;color:white;font-weight:900;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column;box-shadow:0 0 22px #00c8ff2a;touch-action:none;user-select:none}.fire{width:88px;height:88px;background:linear-gradient(145deg,#ff5f8d,#a21d5d);font-size:14px}.jump{width:62px;height:62px;background:linear-gradient(145deg,#31caff,#1766b6);font-size:11px}.action small{font-size:9px;opacity:.85;margin-top:2px}#message{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#07102099;z-index:5;padding:22px}#card{width:min(420px,100%);background:linear-gradient(145deg,#182744f5,#0b1224f5);border:1px solid #6ce7ff88;border-radius:24px;padding:25px 22px;text-align:center;box-shadow:0 0 70px #21bde633}#card h1{font-size:25px;line-height:1.1;margin:7px 0 12px;letter-spacing:1px}#card p{color:#c4d5ec;font-size:14px;line-height:1.65}#start{width:100%;border:0;border-radius:14px;padding:15px;background:linear-gradient(90deg,#3ce0ff,#638cff);color:#071020;font-weight:900;font-size:16px;margin-top:8px}#toast{position:fixed;left:50%;top:25%;transform:translate(-50%,-50%);font-size:24px;font-weight:900;color:#9bf7ff;text-shadow:0 0 15px #00cfff;pointer-events:none;opacity:0;transition:opacity .2s}@media(min-width:800px){.stick{width:130px;height:130px}.knob{left:39px;top:39px}.fire{width:100px;height:100px}}
</style>
</head><body>
<div id="hud"><div class="top"><div class="panel"><div class="title">GEAR FRONTIER</div><div class="stats">SCORE <span id="score">0000</span>　ENEMIES <span id="left">0</span></div><div class="health"><i id="hpbar"></i></div><div style="font-size:10px;color:#c7d7ef;margin-top:4px">ARMOR <span id="hp">100</span>%</div></div><div class="panel help">MOVE：左スティック<br>BLAST：右の赤ボタン<br>JUMP：青ボタン<br>敵を倒して生き残れ！</div></div><div class="bottom"><div id="stick" class="stick"><div id="knob" class="knob"></div></div><div class="actions"><div id="jump" class="action jump">JUMP<small>ジャンプ</small></div><div id="fire" class="action fire">BLAST<small>連射</small></div></div></div></div>
<div id="toast">TARGET DESTROYED!</div>
<div id="message"><div id="card"><div class="title">MISSION 01 / OUTER FRONTIER</div><h1>GEAR FRONTIER<br><span style="color:#71e9ff">BLAST MISSION</span></h1><p>未知の惑星でロボット軍団を撃退しよう。<br>移動しながらエネルギー弾を連射！<br><small>軽量3D・スマホ操作対応の試作版</small></p><button id="start">ミッション開始 ▶</button><p style="font-size:11px;margin-bottom:0">横向きプレイ推奨。画面をタッチして操作できます。</p></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const $=id=>document.getElementById(id);const scene=new THREE.Scene();scene.background=new THREE.Color(0x111b34);scene.fog=new THREE.Fog(0x111b34,18,48);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,100);camera.position.set(0,7,11);
const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'low-power'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=false;renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xa6ddff,0x44304b,2));const sun=new THREE.DirectionalLight(0xffe4b5,2.1);sun.position.set(-5,10,7);scene.add(sun);
const mat=(c,em=0)=>new THREE.MeshStandardMaterial({color:c,roughness:.8,metalness:.15,emissive:em,emissiveIntensity:em?1.4:0});
const groundMat=mat(0x26344b),rockMat=mat(0x4b5272),cyan=mat(0x2de1ff,0x087b9c),orange=mat(0xffa04a,0x8a3500),enemyMat=mat(0xf04468,0x6d0b29),dark=mat(0x151d32),lime=mat(0xa6ff6c,0x3b7c19);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(80,80),groundMat);floor.rotation.x=-Math.PI/2;floor.position.y=-.15;scene.add(floor);const grid=new THREE.GridHelper(80,50,0x3a7c9e,0x34405a);grid.position.y=-.13;scene.add(grid);
// distant low-poly terrain
for(let i=0;i<34;i++){let h=1+Math.random()*3.5;let m=new THREE.Mesh(new THREE.DodecahedronGeometry(.7+Math.random()*1.3,0),rockMat);m.scale.y=h;m.position.set((Math.random()-.5)*48,-.15+h*.45,-10-Math.random()*28);scene.add(m)}
// glowing crystals
for(let i=0;i<12;i++){let g=new THREE.Mesh(new THREE.ConeGeometry(.35+Math.random()*.25,1.3+Math.random(),5),i%2?cyan:lime);g.position.set((Math.random()-.5)*22,.5,-4-Math.random()*23);scene.add(g)}
const player=new THREE.Group();scene.add(player);const torso=new THREE.Mesh(new THREE.BoxGeometry(.72,.85,.48),cyan);torso.position.y=1.05;player.add(torso);const head=new THREE.Mesh(new THREE.SphereGeometry(.35,8,6),mat(0xe5f6ff));head.position.y=1.72;player.add(head);const visor=new THREE.Mesh(new THREE.BoxGeometry(.42,.13,.08),dark);visor.position.set(0,1.75,-.31);player.add(visor);const backpack=new THREE.Mesh(new THREE.BoxGeometry(.35,.55,.32),orange);backpack.position.set(0,1.12,.35);player.add(backpack);const gun=new THREE.Mesh(new THREE.BoxGeometry(.22,.22,.78),dark);gun.position.set(.42,1.08,-.43);player.add(gun);const muzzle=new THREE.Mesh(new THREE.SphereGeometry(.13,8,6),cyan);muzzle.position.set(.42,1.08,-.84);player.add(muzzle);
let hp=100,score=0,running=false,gameover=false,fireHeld=false,jumpV=0,onGround=true,invuln=0;const enemies=[],shots=[],enemyShots=[],fx=[];let spawnTimer=0,fireTimer=0;const clock=new THREE.Clock();
function makeEnemy(){const e=new THREE.Group();const body=new THREE.Mesh(new THREE.BoxGeometry(.8,.85,.65),enemyMat);body.position.y=.75;e.add(body);const eye=new THREE.Mesh(new THREE.BoxGeometry(.42,.12,.08),lime);eye.position.set(0,.92,-.36);e.add(eye);for(let s of [-1,1]){let leg=new THREE.Mesh(new THREE.BoxGeometry(.18,.38,.2),dark);leg.position.set(s*.24,.25,0);e.add(leg)}e.position.set((Math.random()-.5)*15,0,-17-Math.random()*7);e.userData={hp:3,phase:Math.random()*6,hit:0};scene.add(e);enemies.push(e);updateLeft()}
function updateLeft(){$('left').textContent=String(enemies.length).padStart(2,'0')}
function projectile(pos,dir,hostile=false){const mesh=new THREE.Mesh(new THREE.SphereGeometry(hostile?.12:.15,7,5),hostile?orange:cyan);mesh.position.copy(pos);scene.add(mesh);(hostile?enemyShots:shots).push({mesh,dir:dir.clone().normalize(),life:2.3,hostile})}
function burst(pos,color=0x61edff){for(let i=0;i<7;i++){const m=new THREE.Mesh(new THREE.IcosahedronGeometry(.07+Math.random()*.08,0),new THREE.MeshBasicMaterial({color}));m.position.copy(pos);scene.add(m);fx.push({mesh:m,v:new THREE.Vector3((Math.random()-.5)*4,Math.random()*3,(Math.random()-.5)*4),life:.4+Math.random()*.3})}}
function damage(n){if(invuln>0)return;hp=Math.max(0,hp-n);invuln=.35;$('hp').textContent=hp;$('hpbar').style.width=hp+'%';if(hp<=0){gameover=true;running=false;showEnd(false)}}
function showEnd(win){$('message').style.display='flex';$('card').innerHTML=`<div class="title">MISSION REPORT</div><h1 style="color:${win?'#85ffbc':'#ff7195'}">${win?'AREA CLEAR!':'MISSION FAILED'}</h1><p>最終スコア：<b>${score}</b><br>${win?'見事な戦闘だった！':'装備を整えて再挑戦しよう。'}</p><button id="start">もう一度プレイ ↻</button>`;$('start').onclick=reset}
function reset(){for(const a of [...enemies,...shots,...enemyShots,...fx])scene.remove(a.mesh||a);enemies.length=shots.length=enemyShots.length=fx.length=0;player.position.set(0,0,3);hp=100;score=0;spawnTimer=.5;fireTimer=0;jumpV=0;onGround=true;invuln=0;gameover=false;running=true;$('score').textContent='0000';$('hp').textContent='100';$('hpbar').style.width='100%';$('message').style.display='none';updateLeft();for(let i=0;i<4;i++)makeEnemy()}
$('start').onclick=reset;
// touch joystick with mouse support
const stick=$('stick'),knob=$('knob');let stickId=null,axisX=0,axisY=0;function setStick(ev){const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=ev.clientX-cx,dy=ev.clientY-cy;const max=r.width*.34,len=Math.hypot(dx,dy)||1;if(len>max){dx=dx/len*max;dy=dy/len*max}axisX=dx/max;axisY=dy/max;knob.style.left=`${r.width/2-23+dx}px`;knob.style.top=`${r.height/2-23+dy}px`}
stick.addEventListener('pointerdown',e=>{e.preventDefault();stickId=e.pointerId;stick.setPointerCapture(e.pointerId);setStick(e)});stick.addEventListener('pointermove',e=>{if(e.pointerId===stickId)setStick(e)});function releaseStick(e){if(e.pointerId===stickId){stickId=null;axisX=axisY=0;knob.style.left='calc(50% - 23px)';knob.style.top='calc(50% - 23px)'}}stick.addEventListener('pointerup',releaseStick);stick.addEventListener('pointercancel',releaseStick);
$('fire').addEventListener('pointerdown',e=>{e.preventDefault();fireHeld=true;$('fire').setPointerCapture(e.pointerId)});['pointerup','pointercancel','lostpointercapture'].forEach(t=>$('fire').addEventListener(t,()=>fireHeld=false));$('jump').addEventListener('pointerdown',e=>{e.preventDefault();if(running&&onGround){jumpV=6.8;onGround=false}});
const keys={};addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space'&&running&&onGround){jumpV=6.8;onGround=false}if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault()});addEventListener('keyup',e=>keys[e.code]=false);
function update(dt){if(!running)return;invuln=Math.max(0,invuln-dt);const kx=(keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0),ky=(keys.ArrowDown||keys.KeyS?1:0)-(keys.ArrowUp||keys.KeyW?1:0);let mx=THREE.MathUtils.clamp(axisX+kx,-1,1),mz=THREE.MathUtils.clamp(axisY+ky,-1,1);player.position.x=THREE.MathUtils.clamp(player.position.x+mx*dt*7,-9,9);player.position.z=THREE.MathUtils.clamp(player.position.z+mz*dt*6,-1,8);player.rotation.y=mx*.16;if(!onGround||jumpV>0){player.position.y+=jumpV*dt;jumpV-=18*dt;if(player.position.y<=0){player.position.y=0;jumpV=0;onGround=true}}
// third-person follow camera
const target=new THREE.Vector3(player.position.x*.42,3.8,player.position.z+9.2);camera.position.lerp(new THREE.Vector3(player.position.x*.4,6.4,player.position.z+10.5),1-Math.pow(.001,dt));camera.lookAt(player.position.x*.35,1,player.position.z-5.5);
spawnTimer-=dt;if(spawnTimer<=0&&enemies.length<7){makeEnemy();spawnTimer=1.6+Math.random()*1.1}
fireTimer-=dt;if((fireHeld||keys.KeyF||keys.Enter)&&fireTimer<=0){const p=new THREE.Vector3();muzzle.getWorldPosition(p);projectile(p,new THREE.Vector3((player.position.x*.05),.02,-1));fireTimer=.16;burst(p,0x39dfff)}
for(let i=enemies.length-1;i>=0;i--){const e=enemies[i];e.userData.phase+=dt*3;e.position.x+=Math.sin(e.userData.phase)*dt*.8;e.position.z+=dt*(.45+Math.min(score/1500,.6));e.lookAt(player.position.x,.5,player.position.z);e.rotation.x=0;e.rotation.z=0;if(e.position.z>player.position.z+1){damage(12);burst(e.position,0xff5478);scene.remove(e);enemies.splice(i,1);updateLeft();continue}if(Math.random()<dt*.22){const from=e.position.clone().add(new THREE.Vector3(0,.8,0)),to=player.position.clone().add(new THREE.Vector3(0,1,0)).sub(from);projectile(from,to,true)}}
for(const list of [shots,enemyShots])for(let i=list.length-1;i>=0;i--){const s=list[i];s.mesh.position.addScaledVector(s.dir,dt*(s.hostile?8:20));s.life-=dt;let remove=s.life<=0||Math.abs(s.mesh.position.x)>25||s.mesh.position.z<-30||s.mesh.position.z>18;if(!s.hostile&&!remove){for(let j=enemies.length-1;j>=0;j--){const e=enemies[j];if(s.mesh.position.distanceTo(e.position.clone().add(new THREE.Vector3(0,.7,0)))<.8){e.userData.hp--;burst(s.mesh.position,0x7cf6ff);remove=true;if(e.userData.hp<=0){burst(e.position,0xff6c91);scene.remove(e);enemies.splice(j,1);score+=100;$('score').textContent=String(score).padStart(4,'0');updateLeft();$('toast').style.opacity=1;setTimeout(()=>$('toast').style.opacity=0,250)}break}}}else if(s.hostile&&!remove&&s.mesh.position.distanceTo(player.position.clone().add(new THREE.Vector3(0,1,0)))<.65){damage(8);remove=true;burst(player.position,0xffa04a)}if(remove){scene.remove(s.mesh);list.splice(i,1)}}
for(let i=fx.length-1;i>=0;i--){let f=fx[i];f.life-=dt;f.mesh.position.addScaledVector(f.v,dt);f.v.y-=7*dt;if(f.life<=0){scene.remove(f.mesh);fx.splice(i,1)}}if(invuln>0)player.visible=Math.floor(invuln*24)%2===0;else player.visible=true;
if(score>=1500){running=false;showEnd(true)}
}
function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.035);update(dt);renderer.render(scene,camera)}loop();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
